name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lua-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --config-path .config/nvim/.stylua.toml --check .config/nvim .wezterm.lua
      - name: luacheck
        run: |
          sudo apt-get update && sudo apt-get install -y luarocks
          sudo luarocks install luacheck
          luacheck .config/nvim/lua .wezterm.lua

  shell-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mfinelli/setup-shfmt@v3
      - name: shfmt
        run: shfmt -i 2 -ci -bn -d .zshrc
      - name: shellcheck
        run: shellcheck -x .zshrc

  toml-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: baptiste0928/cargo-install@v3
        with:
          crate: taplo-cli
          locked: true
      - name: taplo
        run: |
          taplo format --check \
            .config/starship.toml \
            .config/alacritty/alacritty.toml \
            .config/sesh/sesh.toml \
            .config/yazi/yazi.toml \
            .config/yazi/theme.toml

  prettier-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: latest
      - run: npm install -g prettier
      - name: prettier
        run: |
          prettier --check \
            CLAUDE.md README.md .config/nvim/README.md \
            .config/fastfetch/config.jsonc \
            .config/lazygit/config.yml \
            .github/workflows/*.yml

  stow-dry-run:
    runs-on: ubuntu-latest
    container: ubuntu:latest
    steps:
      - uses: actions/checkout@v4
      - name: install stow
        run: apt-get update && apt-get install -y stow
      - name: dry-run stow
        run: stow -n -v .

  nvim-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - name: link config
        run: |
          mkdir -p ~/.config
          ln -s "$GITHUB_WORKSPACE/.config/nvim" ~/.config/nvim
      - name: headless startup check
        run: |
          nvim --headless -u ~/.config/nvim/init.lua \
            +"lua vim.defer_fn(function() vim.cmd('qa!') end, 5000)" \
            2>&1 | tee /tmp/nvim.log
          if grep -Ei "error|traceback" /tmp/nvim.log; then
            echo "Errors found during nvim startup"
            exit 1
          fi
